<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>挪车通知</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f5f6f8;
      font-family: -apple-system, BlinkMacSystemFont,
                   "Segoe UI", "Microsoft YaHei", sans-serif;
      color: #222;
    }

    .card {
      width: calc(100% - 32px);
      max-width: 420px;
      background: #fff;
      border-radius: 20px;
      padding: 40px 24px;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
    }

    .car {
      font-size: 64px;
      margin-bottom: 16px;
    }

    h1 {
      margin: 0 0 16px;
      font-size: 28px;
    }

    .description {
      color: #666;
      line-height: 1.8;
      margin-bottom: 28px;
    }

    .call-button {
      display: block;
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 17px;
      font-size: 19px;
      font-weight: bold;
      color: white;
      background: #1677ff;
      text-decoration: none;
      cursor: pointer;
    }

    .call-button:active {
      transform: scale(0.98);
    }

    .privacy {
      margin-top: 20px;
      padding: 12px;
      border-radius: 10px;
      background: #f5f7fa;
      color: #888;
      font-size: 13px;
      line-height: 1.6;
    }

    .tip {
      margin-top: 18px;
      font-size: 13px;
      color: #aaa;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="car">🚗</div>

    <h1>挪车通知</h1>

    <div class="description">
      您好，如果这辆车影响了您的出行，<br>
      请联系车主协助挪车。
    </div>

    <!-- 把下面的电话号码改成你的手机号 -->
    <a class="call-button" href="tel:19230856212">
      📞 联系车主
    </a>

    <div class="privacy">
      点击后将直接拨打车主电话<br>
      车主未接听时，请稍后再次联系
    </div>

    <div class="tip">
      无需注册 · 无需加好友
    </div>

  </div>

</body>
</html>
