Create index.html
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>挪车通知</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f5f6f8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   "Microsoft YaHei", sans-serif;
      color: #222;
    }

    .card {
      width: calc(100% - 32px);
      max-width: 420px;
      background: white;
      border-radius: 20px;
      padding: 40px 24px;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    .car {
      font-size: 64px;
      margin-bottom: 16px;
    }

    h1 {
      margin: 0 0 16px;
      font-size: 28px;
    }

    p {
      color: #666;
      line-height: 1.7;
      margin-bottom: 30px;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 17px;
      font-size: 19px;
      font-weight: bold;
      color: white;
      background: #1677ff;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.98);
    }

    .tip {
      margin-top: 20px;
      font-size: 13px;
      color: #999;
    }

    #result {
      display: none;
      margin-top: 24px;
      padding: 15px;
      border-radius: 12px;
      background: #eaf7ee;
      color: #208044;
      line-height: 1.6;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="car">🚗</div>

    <h1>挪车通知</h1>

    <p>
      您好，如果这辆车影响了您的出行，<br>
      请点击下面按钮通知车主。
    </p>

    <button onclick="notifyOwner()">
      🔔 通知车主
    </button>

    <div id="result">
      已发送挪车提醒。<br>
      感谢您的提醒！
    </div>

    <div class="tip">
      无需注册 · 无需加好友
    </div>

  </div>

  <script>
    function notifyOwner() {
      document.getElementById("result").style.display = "block";
    }
  </script>

</body>
</html>
